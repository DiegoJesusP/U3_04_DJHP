spring.application.name=principios_api

#
spring.datasource.url=jdbc:mysql://localhost:3306/almacenes_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

#
server.port=8080

#
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

#
logging.level.com.almacenes=DEBUG
logging.level.org.springframework.security=DEBUG
